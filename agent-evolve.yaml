# agent-evolve manifest — algorithm campaign (post runtime PRs #1, #2).
#
# Goal: find a training-parameter / algorithmic configuration that breaks the
# 4-7% strict-success ceiling at d ~ 0.45 documented across Phases C/E/F/G/H3/I.
# Pipeline runtime work is complete (PR #1: 5.77x; PR #2: +1.43x). This
# campaign keeps physics bit-identical and lets candidates mutate PPO HPs,
# reward weights, curriculum schedules, network architecture, and the
# training scale. Each candidate runs a 500-update training fragment from
# scratch and is scored on policy quality at the difficulty it reached.
version: 1

problem:
  description: >-
    Find a training-parameter configuration that breaks the 4-7% strict-success
    ceiling at d ~ 0.45 on the cart-double-pendulum hybrid-reward task. Each
    candidate runs a 500-update training from scratch and is evaluated by
    deterministic 30-episode eval at the peak difficulty reached. Physics
    bit-equivalence must be preserved (gate: tests/test_pipeline_equivalence.py).
  mode: algorithm
  eval_command: "python tools/algorithm_eval.py"
  expected_baseline_tolerance: 0.20
  metrics:
    - name: strict_success_rate
      optimise: maximize
      primary: true
    - name: loose_success_rate
      optimise: maximize
    - name: peak_difficulty
      optimise: maximize
    - name: physics_tests_pass
      optimise: maximize
      minimum: 1.0    # hard gate: any test failure rejects
    - name: train_completed
      optimise: maximize
      minimum: 1.0    # hard gate: training subprocess must succeed

scope:
  # Files candidates are allowed to mutate. Reward formulas, schedules,
  # network architecture, training-loop logic — all on the table. Env
  # dynamics are NOT (would break the bit-equivalence gate).
  target_files:
    - src/agent/ppo.py
    - src/train.py
    - src/strategies/rewards.py
    - src/strategies/controls.py
    - src/utils/normalize.py
    - src/utils/schedules.py
    - configs/                    # candidates write their own HP configs here

  do_not_touch:
    - tests/test_physics.py
    - tests/test_components.py
    - tests/test_energy_reward.py
    - tests/test_pipeline_equivalence.py
    - tools/evolve_eval.py
    - tools/algorithm_eval.py
    - tools/check_batched_equivalence.py
    - agent-evolve.yaml
    - docs/physics_derivation.md
    - PROJECT_PLAN.md
    # Env dynamics are immutable — physics must stay bit-identical to the
    # baseline trajectory hashes.
    - src/env/cart_pendulum_base.py
    - src/env/double_pendulum.py
    - src/env/single_pendulum.py
    - src/env/double_pendulum_goal.py

evolution:
  # Eight rounds of three candidates each (24 candidates total).
  # Round 1 is forced to `explore` (no frontier yet). Subsequent rounds
  # alternate mutate / crossover / explore per the supervisor's Phase B
  # heuristic.
  rounds: 8
  candidates_per_round: 3
  operators: [explore, mutate, crossover]
  prune_strategy: top_k        # primary metric is strict_success_rate

runtime_mode:
  # The algorithm-eval harness calls into the test suite directly; the
  # framework's property-based equivalence check is redundant.
  equivalence_check: disabled
  property_test_samples: 0

safety:
  protected_branch: master
  agents_can_merge: false
  require_human_approval: true
  branch_cleanup: archive
  run_ablation_report: false

backend:
  type: local
  root_dir: evolve-state

agents:
  supervisor: claude
  explorer: claude
  reviewer: claude

artifact_mode: replace
