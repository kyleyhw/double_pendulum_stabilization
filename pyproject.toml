[project]
name = "double-pendulum-stabilization"
version = "0.2.0"
description = "Double Pendulum Stabilization on a Cart via PPO with Curriculum Learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "torch>=2.2",
    "scipy>=1.11",
    "pygame-ce>=2.5",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "opencv-python>=4.8",
    "tensorboard>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "ty>=0.0.1a32",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["venv", "logs", "docs/images"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",  # long lines (LaTeX in docstrings)
    "N806",  # variable in function should be lowercase (we use M, q, etc. for math)
    "N803",  # argument should be lowercase (same)
]

[tool.ty]
src = ["src"]
